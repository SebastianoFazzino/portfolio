services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NUM_THREADS: "2"
    mem_limit: 3g
    cpus: 2
    command: ["serve"]

volumes:
  ollama:
