name: CodeQL

on:
  push:
    branches: [ main ]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "30 2 1 * *" # monthly, 02:30 UTC on the 1st
  workflow_dispatch:

jobs:
  web:
    name: Analyze (Web - JS/TS)
    if: vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Install deps (web)
        run: pnpm install --frozen-lockfile

      - name: Build (web)
        run: pnpm --filter web build

      - uses: github/codeql-action/analyze@v4

  api:
    name: Analyze (API - Java/Kotlin)
    if: vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build (api)
        run: ./gradlew -p apps/api build -x test

      - uses: github/codeql-action/analyze@v4
