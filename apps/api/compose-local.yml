services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: portfolio-postgres-local
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - portfolio-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d portfolio" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portfolio-postgres-data: