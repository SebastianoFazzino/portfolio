server:
  port: 9909
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  jmx:
    enabled: false
  application:
    name: portfolio-api
  config:
    import: optional:file:apps/api/.env[.properties]
  profiles:
    active: ${ACTIVE_PROFILE:}

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate:
        show_sql: false
        default_schema: portfolio
    show-sql: false
    open-in-view: true

  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration
    schemas: portfolio
    default-schema: portfolio
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    date-format: "yyyy-MM-dd'T'HH:mm:ss.SSSX"
    deserialization:
      fail-on-unknown-properties: false
    mapper:
      accept-case-insensitive-enums: true

cors:
  allowed-origins:
    - http://localhost:3000
    - https://portfolio.sfazzino.com

security:
  bootstrap:
    api-keys:
      admin: ${ADMIN_API_KEY:}
      client: ${CLIENT_API_KEY:}

contact:
  brevo:
    api-key: ${BREVO_API_KEY:}
    to-email: ${CONTACT_TO_EMAIL:}
    from-email: ${CONTACT_FROM_EMAIL:}
    from-name: ${CONTACT_FROM_NAME}
  rate-limit:
    window-ms: ${CONTACT_RATE_LIMIT_WINDOW_MS:60000}
    max-requests: ${CONTACT_RATE_LIMIT_MAX:10}

llm:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    moderation-model: ${OLLAMA_MODEL:qwen2.5:3b-instruct-q4_K_M}
    rag-generation-model: ${OLLAMA_RAG_GENERATION_MODEL:qwen2.5:3b-instruct-q4_K_M}
    rag-embedding-model: ${OLLAMA_EMBEDDING_MODEL:granite-embedding:30m}
    max-tokens: ${OLLAMA_MAX_TOKENS:256}
    moderation-context: ${OLLAMA_MODERATION_CTX:1024}
    rag-context: ${OLLAMA_RAG_CTX:2048}
    keep-alive: ${OLLAMA_KEEP_ALIVE:5m}
    warm-up-interval-ms: ${OLLAMA_WARMUP_INTERVAL:300000}
  prompts:
    rag-path: classpath:prompts/knowledge_v1.txt
    moderation-path: classpath:prompts/contact_moderation_v1.txt

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN
    sun:
      rmi:
        transport:
          tcp: ERROR
